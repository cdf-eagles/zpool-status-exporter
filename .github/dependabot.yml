---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /ci/tools
    schedule:
      interval: weekly
    groups:
      ci-go-tools:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    groups:
      ci-python-tools:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
