---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /ci/tools
    schedule:
      interval: weekly
    groups:
      ci-go-tools:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    groups:
      ci-python-tools:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /packaging/test/almalinux10
    schedule:
      interval: weekly
    groups:
      almalinux10-image:
        patterns: ["*"]

  # The AlmaLinux 9 image takes minor updates only.
  - package-ecosystem: docker
    directory: /packaging/test/almalinux9
    schedule:
      interval: weekly
    ignore:
      - dependency-name: almalinux
        update-types: ["version-update:semver-major"]
    groups:
      almalinux9-image:
        patterns: ["*"]
