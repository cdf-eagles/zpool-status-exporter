---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Dependabot updates the hook's rev, so the action takes its version from it.
      - name: Read the golangci-lint version from .pre-commit-config.yaml
        id: golangci_lint
        run: |
          set -euo pipefail
          version=$(awk '/repo: https:\/\/github.com\/golangci\/golangci-lint$/ { getline; print $2 }' .pre-commit-config.yaml)
          case "${version}" in
            v[0-9]*.[0-9]*.[0-9]*) echo "version=${version}" >> "${GITHUB_OUTPUT}" ;;
            *) echo "::error::No golangci-lint rev in .pre-commit-config.yaml"; exit 1 ;;
          esac

      - name: Run golangci-lint for Linux
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-mode: goinstall

      - name: Run golangci-lint for FreeBSD
        env:
          GOOS: freebsd
        run: golangci-lint run ./...

      - name: Install the Python tools
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-virtualenv -r ci/requirements.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh scripts/*.sh packaging/freebsd/build-pkg.sh packaging/freebsd/rc.d/zpool_status_exporter packaging/linux/*.sh

      - name: Run yamllint
        run: |
          yamllint --version
          yamllint --strict .

      # actionlint turns its shellcheck checks off when shellcheck is not on PATH.
      - name: Run actionlint and the remaining pre-commit hooks
        env:
          SKIP: golangci-lint
        run: |
          set -euo pipefail
          command -v shellcheck
          pre-commit --version
          pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an unshallow clone
        run: test "$(git rev-parse --is-shallow-repository)" = false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Run gitleaks over the full history
        run: '"${RUNNER_TEMP}/gitleaks" git --no-banner --redact --verbose .'

  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Require 90 percent coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 90) ? 0 : 1 }'

      - name: Run govulncheck
        run: go tool -modfile=ci/tools/go.mod govulncheck ./...

      - name: Build for FreeBSD and Linux
        run: |
          for os in freebsd linux; do
            CGO_ENABLED=0 GOOS="$os" GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/zpool-status-exporter
          done
