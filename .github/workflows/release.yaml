---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: zpool-status-exporter
  NFPM_VERSION: v2.48.0

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.check.outputs.kind }}
      version: ${{ steps.check.outputs.version }}
      rc_tag: ${{ steps.check.outputs.rc_tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sha=$(git rev-list -n 1 "$TAG")
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG is not an annotated tag"; exit 1
          fi
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(git rev-parse "$TAG")" --jq .verification.verified)
          if [ "$verified" != true ]; then
            echo "::error::$TAG is not a verified signed tag"; exit 1
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*)
              version=${TAG#v}; version=${version%-rc.*}
              case "$version" in *[!0-9.]*) echo "::error::unsupported tag $TAG"; exit 1 ;; esac
              if ! git merge-base --is-ancestor "$sha" origin/main; then
                echo "::error::$TAG is not on main"; exit 1
              fi
              { echo "kind=rc"; echo "version=$version"; echo "rc_tag=$TAG"; } >> "$GITHUB_OUTPUT"
              ;;
            v[0-9]*.[0-9]*.[0-9]*)
              version=${TAG#v}
              case "$version" in *[!0-9.]*) echo "::error::unsupported tag $TAG"; exit 1 ;; esac
              if ! git merge-base --is-ancestor "$sha" origin/main; then
                echo "::error::$TAG is not on main"; exit 1
              fi
              rc=$(git tag --points-at "$sha" --list "v${version}-rc.*" --sort=-version:refname | head -n 1)
              if [ -z "$rc" ]; then
                echo "::error::no release candidate tag v${version}-rc.N points at $sha"; exit 1
              fi
              { echo "kind=final"; echo "version=$version"; echo "rc_tag=$rc"; } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported tag $TAG"; exit 1
              ;;
          esac

  build:
    name: Build binaries and the RPM package
    needs: verify
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          pkg=github.com/prometheus/common/version
          ldflags="-s -w -X ${pkg}.Version=${VERSION} -X ${pkg}.Revision=${GITHUB_SHA} -X ${pkg}.Branch=${GITHUB_REF_NAME}"
          ldflags="${ldflags} -X ${pkg}.BuildUser=github-actions -X ${pkg}.BuildDate=$(date -u +%Y%m%d-%H:%M:%S)"
          for os in freebsd linux; do
            CGO_ENABLED=0 GOOS="$os" GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "dist/${PROJECT}-${os}-amd64" ./cmd/zpool-status-exporter
          done
          gzip -9nc docs/zpool-status-exporter.8 > dist/zpool-status-exporter.8.gz

      - name: Write the RPM signing key
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p build
          GNUPGHOME="${RUNNER_TEMP}/gnupg"
          export GNUPGHOME
          mkdir -m 0700 "${GNUPGHOME}"
          committed=packaging/packages-signing.asc
          if [ -z "${PACKAGES_SIGNING_KEY}" ]; then
            echo "::error::PACKAGES_SIGNING_KEY is not set"; exit 1
          fi
          printf '%s\n' "${PACKAGES_SIGNING_KEY}" > build/rpm-signing.asc
          want=$(gpg --show-keys --with-colons "${committed}" | awk -F: '/^fpr/ { print $10; exit }')
          got=$(gpg --show-keys --with-colons build/rpm-signing.asc | awk -F: '/^fpr/ { print $10; exit }')
          if [ -z "${got}" ] || [ "${got}" != "${want}" ]; then
            echo "::error::PACKAGES_SIGNING_KEY does not match ${committed}"; exit 1
          fi
          rm -rf "${GNUPGHOME}"

      - name: Build the RPM package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: go run "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}" pkg --packager rpm --config packaging/nfpm.yaml --target dist/

      - name: Remove the signing key
        if: always()
        run: rm -f build/rpm-signing.asc

      - name: Check, install, and remove the RPM package on AlmaLinux 9 and 10
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          rpm="dist/${PROJECT}-${VERSION}-1.x86_64.rpm"
          for distribution in almalinux9 almalinux10; do
            echo "== ${distribution}"
            docker build --no-cache --progress plain \
              --build-arg VERSION="${VERSION}" \
              --build-arg RPM="${rpm}" \
              --build-arg RPM_PUBKEY=packaging/packages-signing.asc \
              --file "packaging/test/${distribution}/Dockerfile" .
          done

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  freebsd-pkg:
    name: Build the FreeBSD package
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-linux
          path: dist/

      - name: Build the package in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b  # v1.6.0
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        with:
          release: "15.1"
          usesh: true
          envs: VERSION PROJECT
          run: |
            set -eu
            mkdir -p pkg-out
            chmod 0755 "dist/${PROJECT}-freebsd-amd64"
            sh packaging/freebsd/build-pkg.sh "$VERSION" "dist/${PROJECT}-freebsd-amd64" pkg-out

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-freebsd-pkg
          path: pkg-out/*.pkg
          if-no-files-found: error

  publish-rc:
    name: Publish the release candidate
    needs: [verify, build, freebsd-pkg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --prerelease --title "$TAG" --notes "Release candidate for v${{ needs.verify.outputs.version }}. See CHANGELOG.md."

  publish-final:
    name: Publish the release from its release candidate
    needs: verify
    if: needs.verify.outputs.kind == 'final'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the release candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        run: gh release download "$RC_TAG" --dir dist

      - name: Check the files against the release candidate checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Verify the release candidate attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        working-directory: dist
        run: |
          set -eu
          awk '{print $2}' SHA256SUMS | while read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yaml" \
              --source-ref "refs/tags/${RC_TAG}"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        run: gh release create "$TAG" dist/* --verify-tag --latest --title "$TAG" --notes "Promoted from ${RC_TAG} without rebuilding. See CHANGELOG.md."

  package-repository:
    name: Open the package repository pull request
    needs: [verify, publish-final]
    if: needs.verify.outputs.kind == 'final'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --pattern SHA256SUMS --dir "${RUNNER_TEMP}"

      # The token reaches only the package repository, with contents and pull
      # requests write.
      - name: Create a token for the package repository
        id: packages-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ vars.PACKAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: packages
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request on the package repository
        env:
          GH_TOKEN: ${{ steps.packages-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          RC_TAG: ${{ needs.verify.outputs.rc_tag }}
        run: sh scripts/update-package-repository.sh pr "$TAG" "$RC_TAG" "${RUNNER_TEMP}/SHA256SUMS"
