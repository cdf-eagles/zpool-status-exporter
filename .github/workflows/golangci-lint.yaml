name: Lint Python Code

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - '*.go'  # Trigger workflow only when Go files change
      - '**/*.go'  # Trigger workflow only when Go files change

permissions:
  contents: read
  pull-requests: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get changed Go files
        id: get_changed_files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            *.go
            **/*.go

      - name: Run golangci-lint
        if: steps.get_changed_files.outputs.any_changed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
