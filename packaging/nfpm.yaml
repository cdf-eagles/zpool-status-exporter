---
name: zpool-status-exporter
arch: amd64
platform: linux
version: ${VERSION}
section: admin
maintainer: noreply@github.com
description: Prometheus exporter for ZFS
homepage: https://github.com/cdf-eagles/zpool-status-exporter
license: BSD-3-Clause
recommends:
  - smartmontools
contents:
  - src: dist/zpool-status-exporter-linux-amd64
    dst: /usr/bin/zpool-status-exporter
    file_info:
      mode: 0755
  - src: packaging/linux/zpool-status-exporter.service
    dst: /usr/lib/systemd/system/zpool-status-exporter.service
    file_info:
      mode: 0644
  - src: packaging/linux/zpool-status-exporter.sysconfig
    dst: /etc/sysconfig/zpool-status-exporter
    type: config|noreplace
    file_info:
      mode: 0644
  - src: dist/zpool-status-exporter.8.gz
    dst: /usr/share/man/man8/zpool-status-exporter.8.gz
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
